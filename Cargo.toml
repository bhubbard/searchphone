[package]
name = "searchphone"
version = "1.0.0"
edition = "2021"
description = "OSINT suite for phone number lookup, intelligence gathering, and automated reporting in Rust"
license = "MIT"
readme = "README.md"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
phonenumber = "0.3"
colored = "3.0"
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
printpdf = "0.7"
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
indicatif = "0.17"
